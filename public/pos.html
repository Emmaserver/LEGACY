<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - Terminal de Vendas</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased overflow-hidden">

    <div class="flex h-screen">

        <!-- NAVIGATOR / SIDEBAR -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between hidden md:flex shrink-0">
            <div>
                <div class="p-6 border-b border-slate-800">
                    <h1 class="text-xl font-bold tracking-wide text-indigo-400">Gestão & Vendas</h1>
                    <p class="text-xs text-gray-400 mt-1">Materiais de Construção</p>
                </div>
                <nav class="mt-6 px-4 space-y-2">
                    <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-400 hover:bg-slate-800 hover:text-white font-medium transition">
                        <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                    </a>
                    <a href="produtos.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-400 hover:bg-slate-800 hover:text-white font-medium transition">
                        <i class="fa-solid fa-boxes-stacked w-5"></i> Produtos & Stock
                    </a>
                    <a href="clientes.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-400 hover:bg-slate-800 hover:text-white font-medium transition">
                        <i class="fa-solid fa-users w-5"></i> Clientes
                    </a>
                    <a href="pos.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-indigo-600 text-white font-medium transition">
                        <i class="fa-solid fa-cart-shopping w-5"></i> Nova Venda (POS)
                    </a>
                    <a href="historico.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-400 hover:bg-slate-800 hover:text-white font-medium transition">
                        <i class="fa-solid fa-clock-rotate-left w-5"></i> Histórico
                    </a>
                </nav>
            </div>
            <div class="p-4 border-t border-slate-800 text-xs text-gray-500 text-center">
                v1.0.0 &bull; Terminal de Caixa
            </div>
        </aside>

        <!-- ÁREA DE CONTEÚDO PRINCIPAL (Dividida em 2 Colunas) -->
        <main class="flex-1 flex flex-col md:flex-row h-full overflow-hidden">
            
            <!-- ESQUERDA: CATÁLOGO DE PRODUTOS -->
            <section class="flex-1 flex flex-col h-full bg-gray-100 overflow-hidden border-r border-gray-200">
                <!-- Cabeçalho de Busca -->
                <div class="p-4 bg-white border-b flex flex-col sm:flex-row gap-3 shadow-sm">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400 text-sm"></i>
                        <input type="text" id="pos-busca" onkeyup="filtrarProdutosPOS()" placeholder="Buscar produto por nome ou código..." class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-gray-50">
                    </div>
                    <select id="pos-categoria" onchange="filtrarProdutosPOS()" class="border border-gray-300 rounded-lg px-3 py-2.5 text-sm bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none text-gray-600">
                        <option value="">Todas as Categorias</option>
                        <option value="Cimento">Cimento</option>
                        <option value="Ferragens">Ferragens</option>
                        <option value="Tintas">Tintas</option>
                        <option value="Agregados">Agregados</option>
                        <option value="Tubos">Tubos</option>
                    </select>
                </div>

                <!-- Grid de Produtos -->
                <div id="grid-produtos" class="p-6 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 flex-1">
                    <!-- Cards carregados via JS -->
                </div>
            </section>

            <!-- DIREITA: CARRINHO E FINALIZAÇÃO DE VENDA -->
            <section class="w-full md:w-96 lg:w-[420px] bg-white flex flex-col h-full shadow-lg border-l border-gray-200 shrink-0">
                
                <!-- Topo do Carrinho / Seleção de Cliente -->
                <div class="p-4 border-b bg-gray-50">
                    <h3 class="font-bold text-gray-800 mb-2 flex items-center justify-between">
                        <span><i class="fa-solid fa-cart-shopping text-indigo-600 mr-2"></i> Carrinho Atual</span>
                        <button onclick="limparCarrinho()" class="text-xs text-rose-600 hover:underline font-normal">Limpar tudo</button>
                    </h3>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Cliente</label>
                        <select id="select-cliente" class="w-full border rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="1">Cliente Geral (Consumidor Final)</option>
                            <option value="2">Construtora Kianda Lda</option>
                            <option value="3">João Manuel Domingos</option>
                        </select>
                    </div>
                </div>

                <!-- Lista de Itens no Carrinho -->
                <div id="lista-carrinho" class="flex-1 overflow-y-auto p-4 divide-y divide-gray-100">
                    <!-- Itens inseridos dinamicamente pelo js/pos.js -->
                </div>

                <!-- Resumo Financeiro & Pagamento -->
                <div class="p-4 border-t bg-slate-50 space-y-3">
                    <div class="space-y-1.5 text-sm">
                        <div class="flex justify-between text-gray-500">
                            <span>Subtotal</span>
                            <span id="pos-subtotal">0,00 Kz</span>
                        </div>
                        <div class="flex justify-between text-gray-500">
                            <span>Imposto (0%)</span>
                            <span>0,00 Kz</span>
                        </div>
                        <div class="flex justify-between text-lg font-bold text-slate-900 pt-2 border-t border-gray-200">
                            <span>Total a Pagar</span>
                            <span id="pos-total" class="text-indigo-600">0,00 Kz</span>
                        </div>
                    </div>

                    <!-- Métodos de Pagamento -->
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Forma de Pagamento</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button type="button" onclick="selecionarMetodo('Numerário')" id="btn-metodo-Numerário" class="btn-metodo border text-xs py-2 rounded-lg font-medium border-indigo-600 bg-indigo-50 text-indigo-700">Numerário</button>
                            <button type="button" onclick="selecionarMetodo('TPA')" id="btn-metodo-TPA" class="btn-metodo border text-xs py-2 rounded-lg font-medium border-gray-200 hover:bg-gray-100 text-gray-700">TPA / Multicaixa</button>
                            <button type="button" onclick="selecionarMetodo('Transferência')" id="btn-metodo-Transferência" class="btn-metodo border text-xs py-2 rounded-lg font-medium border-gray-200 hover:bg-gray-100 text-gray-700">Transferência</button>
                        </div>
                    </div>

                    <!-- Botão Concluir Venda -->
                    <button onclick="finalizarVenda()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-check"></i> Emitir Venda
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="js/app.js"></script>
    <script src="js/pos.js"></script>
</body>
</html>
